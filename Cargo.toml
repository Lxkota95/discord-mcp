[package]
name = "discord-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A Discord MCP server in Rust, built milestone by milestone (see learn/)"
license = "MIT"
repository = "https://github.com/Lxkota95/discord-mcp"
publish = false

[dependencies]
# All of the course's dependencies are listed from the start, so one `cargo fetch` before going
# offline covers every milestone. Unused ones cost nothing until a milestone uses them.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
